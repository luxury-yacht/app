name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release (uncheck to build only)"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v[1-9]*"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Run tests
        run: |
          echo "Run a build to ensure frontend/dist is generated"
          wails3 build
          echo "Run backend tests"
          mage qc:vet test:backend
          echo "Run frontend tests"
          mage qc:lint qc:typecheck test:frontend

  build:
    needs: test
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_BACKEND_DSN: ${{ secrets.SENTRY_BACKEND_DSN }}
      SENTRY_FRONTEND_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
      SENTRY_FRONTEND_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
    strategy:
      # Don't fail the whole build if one matrix job fails.
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            goos: darwin
            arch: arm64-and-amd64
            artifact_name: artifacts-darwin
            artifact_path: bin/*-darwin-*.dmg
          - runner: windows-latest
            goos: windows
            arch: amd64
            artifact_name: artifacts-windows-amd64
            artifact_path: bin/*-amd64-installer.exe
          - runner: windows-latest-arm
            goos: windows
            arch: arm64
            artifact_name: artifacts-windows-arm64
            artifact_path: bin/*-arm64-installer.exe
          - runner: ubuntu-latest
            goos: linux
            arch: amd64
            artifact_name: artifacts-linux-amd64
            artifact_path: |
              bin/*.deb
              bin/*.rpm
          - runner: ubuntu-latest-arm
            goos: linux
            arch: arm64
            artifact_name: artifacts-linux-arm64
            artifact_path: |
              bin/*.deb
              bin/*.rpm

    runs-on: ${{ matrix.runner }}
    name: Build ${{ matrix.goos }} (${{ matrix.arch }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: ${{ matrix.goos == 'linux' }}

      - name: Set up macOS code signing
        if: matrix.goos == 'darwin'
        id: macos_signing
        uses: ./.github/actions/macos-signing
        with:
          macos_certificate: ${{ secrets.MACOS_CERTIFICATE }}
          macos_certificate_pwd: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Install Windows dependencies
        if: matrix.goos == 'windows'
        uses: ./.github/actions/install-nsis

      - name: Create package for macOS (signed and notarized)
        if: matrix.goos == 'darwin'
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.macos_identity }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials luxury-yacht-ci \
            --apple-id "$MACOS_APPLE_ID" \
            --team-id "$MACOS_APPLE_TEAM_ID" \
            --password "$MACOS_APPLE_APP_PASSWORD"

          wails3 task darwin:package ARCH=arm64
          wails3 tool sign \
            --input bin/luxury-yacht.app \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --notarize \
            --keychain-profile luxury-yacht-ci
          wails3 task darwin:create:dmg
          mv bin/luxury-yacht.dmg bin/luxury-yacht-darwin-arm64.dmg

          wails3 task darwin:package ARCH=amd64
          wails3 tool sign \
            --input bin/luxury-yacht.app \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --notarize \
            --keychain-profile luxury-yacht-ci
          wails3 task darwin:create:dmg
          mv bin/luxury-yacht.dmg bin/luxury-yacht-darwin-amd64.dmg

      - name: Create package for Linux
        if: matrix.goos == 'linux'
        env:
          GOARCH: ${{ matrix.arch }}
        run: |
          wails3 task linux:build ARCH=${{ matrix.arch }}
          wails3 task linux:generate:deb
          wails3 task linux:generate:rpm

      - name: Create package for Windows (unsigned)
        if: matrix.goos == 'windows'
        run: |
          wails3 task windows:package ARCH=${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    if: ${{ github.event.inputs.release == 'true' || github.event_name == 'push' }}
    needs:
      - test
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "false"
          install-wails: "false"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Publish GitHub release
        run: |
          export GITHUB_RUN_NUMBER="${{ github.run_number }}"
          mage release:app

  update-site:
    if: ${{ github.event.inputs.release == 'true' || github.event_name == 'push' }}
    needs:
      - release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          setup-node: "false"
          install-wails: "false"

      - name: Update version on website
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: mage release:site
