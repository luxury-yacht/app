# Builds every platform and publishes a GitHub release.
#
#   plan -> test -> build-macos   -> prepare-release -> release -> update-site
#                   build-windows
#                   build-linux
#
# A tag push publishes a release. A manual run is a dry run unless "Create
# GitHub release" is checked; dry runs can skip the tests, build only some
# platforms, and try Windows signing with the SignPath test certificate.
name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Create GitHub release (uncheck for full dry run)"
        required: false
        default: false
        type: boolean
      skip_tests:
        description: "Skip the test job (dry runs only)"
        required: false
        default: false
        type: boolean
      sign_windows:
        description: "Sign Windows builds with the SignPath test certificate (dry runs only)"
        required: false
        default: false
        type: boolean
      # Platform checkboxes: unchecking any is for dry runs only, and release
      # preparation runs only when every platform is built.
      build_macos:
        description: "Build macOS"
        required: false
        default: true
        type: boolean
      build_windows:
        description: "Build Windows"
        required: false
        default: true
        type: boolean
      build_linux:
        description: "Build Linux"
        required: false
        default: true
        type: boolean
  push:
    tags:
      - "v[1-9]*"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      sign_windows: ${{ steps.plan.outputs.sign_windows }}
    steps:
      - name: Check run options
        id: plan
        env:
          PUBLISH: ${{ github.event_name == 'push' || github.event.inputs.release == 'true' }}
          SKIP_TESTS: ${{ github.event.inputs.skip_tests == 'true' }}
          SIGN_WINDOWS_REQUESTED: ${{ github.event.inputs.sign_windows == 'true' }}
          # Published releases sign Windows builds only when this is "true". Turn
          # it on once SignPath Foundation issues the release certificate.
          RELEASES_SIGN_WINDOWS: "false"
          # Null on tag pushes, which have no run options.
          INPUTS: ${{ toJSON(github.event.inputs) }}
        run: |
          builds="$(jq -c '[(. // {}) | to_entries[] | select(.key | startswith("build_")) | .value | tostring]' <<<"$INPUTS")"
          if [ "$PUBLISH" = "true" ]; then
            if [ "$SKIP_TESTS" = "true" ] || jq -e 'any(. == "false")' <<<"$builds" >/dev/null; then
              echo "::error::A published release must run the tests and build every platform."
              exit 1
            fi
            sign_windows="$RELEASES_SIGN_WINDOWS"
          else
            if jq -e 'length > 0 and all(. == "false")' <<<"$builds" >/dev/null; then
              echo "::error::Select at least one platform to build."
              exit 1
            fi
            sign_windows="$SIGN_WINDOWS_REQUESTED"
          fi
          [ "$sign_windows" = "true" ] || sign_windows=false
          {
            echo "publish=$PUBLISH"
            echo "sign_windows=$sign_windows"
          } >> "$GITHUB_OUTPUT"

  test:
    needs:
      - plan
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    runs-on: ubuntu-latest-32core-amd64 # ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Validate release tag
        if: ${{ needs.plan.outputs.publish == 'true' }}
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: go run ./cmd/project validate-release-tag

      - name: Run tests
        run: |
          echo "🟣 Run a build to ensure frontend/dist is generated"
          wails3 build
          echo "🟣 Run backend vet"
          wails3 task qc:vet
          echo "🟣 Run backend tests"
          # Wails' Linux single-instance check requires a session bus.
          dbus-run-session -- wails3 task test:backend
          echo "🟣 Run frontend lint"
          wails3 task qc:lint
          echo "🟣 Run frontend typecheck"
          wails3 task qc:typecheck
          echo "🟣 Run frontend tests"
          wails3 task test:frontend

  build-macos:
    name: Build macOS (${{ matrix.arch }})
    needs:
      - plan
      - test
    if: ${{ !cancelled() && !failure() && github.event.inputs.build_macos != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: amd64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_BACKEND_DSN: ${{ secrets.SENTRY_BACKEND_DSN }}
      SENTRY_FRONTEND_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
      SENTRY_FRONTEND_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Set up code signing
        id: macos_signing
        uses: ./.github/actions/macos-signing
        with:
          macos_certificate: ${{ secrets.MACOS_CERTIFICATE }}
          macos_certificate_pwd: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Package, sign, and notarize
        env:
          MACOS_SIGNING_IDENTITY: ${{ steps.macos_signing.outputs.macos_identity }}
          MACOS_APPLE_ID: ${{ secrets.APPLE_ID }}
          MACOS_APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          MACOS_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP_PRODUCT_NAME="$(go run ./cmd/project product-name)"
          APP_BUNDLE="bin/${APP_PRODUCT_NAME}.app"
          APP_DMG="bin/${APP_PRODUCT_NAME}.dmg"

          xcrun notarytool store-credentials luxury-yacht-ci \
            --apple-id "$MACOS_APPLE_ID" \
            --team-id "$MACOS_APPLE_TEAM_ID" \
            --password "$MACOS_APPLE_APP_PASSWORD"

          wails3 task darwin:package ARCH=${{ matrix.arch }}
          wails3 tool sign \
            --input "$APP_BUNDLE" \
            --identity "$MACOS_SIGNING_IDENTITY" \
            --notarize \
            --keychain-profile luxury-yacht-ci
          codesign --verify --deep --strict "$APP_BUNDLE"
          spctl --assess --type execute "$APP_BUNDLE"
          xcrun stapler validate "$APP_BUNDLE"
          wails3 task darwin:create:updater-archive ARCH=${{ matrix.arch }}
          UPDATER_ARTIFACT="bin/$(GOOS=darwin GOARCH=${{ matrix.arch }} RELEASE_FORMAT=updater go run ./cmd/project release-artifact-name)" GOARCH=${{ matrix.arch }} wails3 task release:validate-macos-updater
          wails3 task darwin:create:dmg
          mv "$APP_DMG" "bin/$(GOOS=darwin GOARCH=${{ matrix.arch }} RELEASE_FORMAT=dmg go run ./cmd/project release-artifact-name)"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-macos-${{ matrix.arch }}
          path: |
            bin/*-macos-*.dmg
            bin/*-darwin-*.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows (${{ matrix.arch }})
    needs:
      - plan
      - test
    if: ${{ !cancelled() && !failure() && github.event.inputs.build_windows != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: windows-2025
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      # SignPath reads this run's job details and downloads the unsigned files.
      actions: read
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_BACKEND_DSN: ${{ secrets.SENTRY_BACKEND_DSN }}
      SENTRY_FRONTEND_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
      SENTRY_FRONTEND_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      # Windows signing is optional until the SignPath release certificate is
      # issued; the plan job decides whether this run signs.
      SIGN_WINDOWS: ${{ needs.plan.outputs.sign_windows }}
      # Releases use the trusted certificate and need approval in SignPath;
      # dry runs use the test certificate and are signed without approval.
      SIGNPATH_SIGNING_POLICY: ${{ needs.plan.outputs.publish == 'true' && 'release-signing' || 'test-signing' }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Install NSIS
        uses: ./.github/actions/install-nsis

      - name: Build executable
        id: build
        run: |
          # Fail on any failing command, not just the last one the runner checks.
          $PSNativeCommandUseErrorActionPreference = $true
          go test ./internal/updatetemp ./internal/updateidentity ./internal/windowsinstall ./backend -run Windows -count=1
          wails3 task windows:build ARCH=${{ matrix.arch }}
          $config = go run ./cmd/project config | ConvertFrom-Json
          "version=$($config.version)" >> $env:GITHUB_OUTPUT
          "executable=bin/$(go run ./cmd/project binary-name).exe" >> $env:GITHUB_OUTPUT

      # Both installers and the updater payload carry this executable, so it is
      # signed before packaging.
      - name: Sign executable
        if: env.SIGN_WINDOWS == 'true'
        uses: ./.github/actions/windows-signing
        with:
          path: ${{ steps.build.outputs.executable }}
          artifact-name: signpath-windows-executable-${{ matrix.arch }}
          artifact-configuration: windows-exe
          signing-policy: ${{ env.SIGNPATH_SIGNING_POLICY }}
          version: ${{ steps.build.outputs.version }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

      - name: Package installers and updater
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          wails3 task windows:package:from-built ARCH=${{ matrix.arch }}
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          $env:WINDOWS_ARCH = "${{ matrix.arch }}"
          $env:RELEASE_FORMAT = "updater"
          $env:UPDATER_ARTIFACT = "bin/$(go run ./cmd/project release-artifact-name)"
          wails3 task release:validate-windows-updater
          $config = go run ./cmd/project config | ConvertFrom-Json
          $userInstaller = Get-ChildItem "bin/*-windows-${{ matrix.arch }}-user-installer.exe" -File -ErrorAction Stop
          if ($userInstaller.Count -ne 1) { throw "Expected exactly one Windows user installer" }
          $systemInstaller = Get-ChildItem "bin/*-windows-${{ matrix.arch }}-system-installer.exe" -File -ErrorAction Stop
          if ($systemInstaller.Count -ne 1) { throw "Expected exactly one Windows system installer" }
          ./build/windows/package-drill.ps1 -UserInstaller $userInstaller.FullName -SystemInstaller $systemInstaller.FullName -ExpectedVersion $config.version -ProductName $config.productName -UninstallRegistryPath $config.windowsUninstallRegistryPath

      - name: Sign installers
        if: env.SIGN_WINDOWS == 'true'
        uses: ./.github/actions/windows-signing
        with:
          path: bin/*-windows-${{ matrix.arch }}-*-installer.exe
          artifact-name: signpath-windows-installers-${{ matrix.arch }}
          artifact-configuration: windows-installers
          signing-policy: ${{ env.SIGNPATH_SIGNING_POLICY }}
          version: ${{ steps.build.outputs.version }}
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-windows-${{ matrix.arch }}
          path: |
            bin/*-windows-${{ matrix.arch }}.exe
            bin/*-windows-${{ matrix.arch }}-user-installer.exe
            bin/*-windows-${{ matrix.arch }}-system-installer.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux (${{ matrix.arch }})
    needs:
      - plan
      - test
    if: ${{ !cancelled() && !failure() && github.event.inputs.build_linux != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_BACKEND_DSN: ${{ secrets.SENTRY_BACKEND_DSN }}
      SENTRY_FRONTEND_DSN: ${{ secrets.SENTRY_FRONTEND_DSN }}
      SENTRY_FRONTEND_PROJECT: ${{ secrets.SENTRY_FRONTEND_PROJECT }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Package
        run: |
          wails3 task linux:build ARCH=${{ matrix.arch }}
          wails3 task linux:generate:deb ARCH=${{ matrix.arch }}
          wails3 task linux:generate:rpm ARCH=${{ matrix.arch }}
          wails3 task linux:generate:portable ARCH=${{ matrix.arch }}
          UPDATER_ARTIFACT="bin/$(GOOS=linux GOARCH=${{ matrix.arch }} RELEASE_FORMAT=updater go run ./cmd/project release-artifact-name)" GOARCH=${{ matrix.arch }} wails3 task release:validate-linux-updater

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-linux-${{ matrix.arch }}
          path: |
            bin/*.deb
            bin/*.rpm
            bin/*-linux-*.tar.gz
          if-no-files-found: error

  prepare-release:
    needs:
      - build-macos
      - build-windows
      - build-linux
    # Release preparation needs every platform's updater payloads, so it runs
    # only when all three platforms were built.
    if: ${{ !cancelled() && needs.build-macos.result == 'success' && needs.build-windows.result == 'success' && needs.build-linux.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          # Excludes the unsigned signpath-* uploads, which share release file names.
          pattern: artifacts-*
          path: ./artifacts

      - name: Materialize updater signing key
        env:
          UPDATER_PRIVATE_KEY_PEM: ${{ secrets.UPDATER_PRIVATE_KEY_PEM }}
        run: |
          set -euo pipefail
          test -n "$UPDATER_PRIVATE_KEY_PEM"
          umask 077
          printf '%s\n' "$UPDATER_PRIVATE_KEY_PEM" > "$RUNNER_TEMP/updater.key"

      - name: Prepare signed updater manifest release asset
        env:
          UPDATER_ARTIFACTS_DIR: ./artifacts
          UPDATER_PRIVATE_KEY_PATH: ${{ runner.temp }}/updater.key
          UPDATER_PUBLIC_KEY: backend/updater_public_key.pem
        run: wails3 task release:prepare-updater-manifest

      - name: Remove updater signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/updater.key"

      - name: Validate prepared GitHub release without publishing
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_DRY_RUN: "true"
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: wails3 task release:app

      - name: Upload prepared release assets
        uses: actions/upload-artifact@v7
        with:
          name: prepared-release-assets
          path: ./artifacts
          if-no-files-found: error

  release:
    needs:
      - plan
      - prepare-release
    if: ${{ needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
      RELEASE_DRY_RUN: "false"
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Download prepared release assets
        uses: actions/download-artifact@v8
        with:
          name: prepared-release-assets
          path: ./artifacts

      - name: Publish GitHub release
        run: |
          export GITHUB_RUN_NUMBER="${{ github.run_number }}"
          wails3 task release:app

  update-site:
    # Runs only after a published release.
    needs:
      - release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup toolchain
        uses: ./.github/actions/setup-toolchain
        with:
          install-linux-deps: "true"

      - name: Update version on website
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
        run: wails3 task release:site
