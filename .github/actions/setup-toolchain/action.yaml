name: Setup toolchain
description: Install the Mise-managed project toolchain.
inputs:
  install-linux-deps:
    description: Whether to install Linux build dependencies.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      if: ${{ inputs.install-linux-deps == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        # Wails v3's default Linux backend uses GTK4 and WebKitGTK 6. The AppImage
        # is a squashfs image built with squashfs-tools.
        if dpkg-query -W -f='${Status}' libwebkitgtk-6.0-dev 2>/dev/null | grep -q "install ok installed" \
          && dpkg-query -W -f='${Status}' rpm 2>/dev/null | grep -q "install ok installed" \
          && dpkg-query -W -f='${Status}' squashfs-tools 2>/dev/null | grep -q "install ok installed"; then
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev rpm squashfs-tools

    - name: Setup Mise toolchain
      uses: jdx/mise-action@v4
