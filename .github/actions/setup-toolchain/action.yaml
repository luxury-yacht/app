name: Setup toolchain
description: Install the Mise-managed project toolchain.
inputs:
  setup-node:
    description: Whether to install Node.
    required: false
    default: 'true'
  install-wails:
    description: Whether to install Wails.
    required: false
    default: 'true'
  install-mage:
    description: Whether to install Mage.
    required: false
    default: 'true'
  install-linux-deps:
    description: Whether to install Linux build dependencies.
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Setup Mise toolchain
      uses: jdx/mise-action@v4
      with:
        install_args: >-
          go
          go:honnef.co/go/tools/cmd/staticcheck
          ${{ inputs.setup-node == 'true' && 'node npm' || '' }}
          ${{ inputs.install-wails == 'true' && 'go:github.com/wailsapp/wails/v2/cmd/wails' || '' }}
          ${{ inputs.install-mage == 'true' && 'mage' || '' }}

    - name: Install Linux build dependencies
      if: ${{ inputs.install-linux-deps == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        # Wails Linux packaging needs WebKit headers and rpm tooling.
        if dpkg-query -W -f='${Status}' libwebkit2gtk-4.1-dev 2>/dev/null | grep -q "install ok installed" \
          && dpkg-query -W -f='${Status}' rpm 2>/dev/null | grep -q "install ok installed"; then
          exit 0
        fi
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev rpm
