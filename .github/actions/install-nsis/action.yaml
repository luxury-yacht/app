name: Install NSIS
description: Installs NSIS (Windows only)

runs:
  using: composite
  steps:
    - name: Install NSIS
      shell: pwsh
      run: |
        $nsisVersion = (mise config get vars.nsis_version).Trim()
        if (-not $nsisVersion) {
          throw "vars.nsis_version is missing from mise.toml"
        }
        & "$env:GITHUB_ACTION_PATH\install-nsis.ps1" `
          -NsisVersion $nsisVersion `
          -AddToGitHubPath
