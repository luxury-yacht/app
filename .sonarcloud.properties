# SonarQube Cloud — Automatic Analysis configuration.
#
# This project has no CI-based scanner (no sonar step in .github/workflows), so
# SonarCloud analyses it automatically. Automatic Analysis reads this file;
# sonar-project.properties is for CI-based scanners and is ignored here.
#
# Two further constraints from the Automatic Analysis docs:
#   - only the file on the DEFAULT BRANCH takes effect, so this does nothing
#     until it lands on main;
#   - values here override the equivalent settings in the SonarCloud UI.

# --- Generated code -----------------------------------------------------------
# Excluded because it cannot be fixed: every one of these files is overwritten by
# a build step, so any issue "resolved" here returns on the next generation.
#
#   frontend/bindings     Wails Go->TS bindings. Generated model constructors
#                         intentionally repeat the same conversion structure.
#   frontend/src/**/*.generated.ts
#                         Generated refresh contracts and object-action metadata.
#                         Their hand-written generators remain analyzed below.
#   backend/*_generated.go Go codegen output (carries the
#                         "// Code generated ... DO NOT EDIT" header).
#
# NOT excluded, despite the names: backend/internal/genrefreshcontracts and
# backend/internal/genobjectactions are the generators themselves — hand-written
# source with their own tests. Their findings are real.
#
# PNG, ICNS, and ICO assets contain no analyzable source. SonarCloud may still
# attempt charset detection while collecting their metadata, which produces a
# false source-file encoding warning when their binary contents cannot be decoded
# as UTF-8.
sonar.exclusions=frontend/bindings/**/*,frontend/src/**/*.generated.ts,backend/object_detail_fetchers_generated.go,backend/resource_details_generated.go,**/*.png,**/*.icns,**/*.ico

# --- Test code ----------------------------------------------------------------
# Tests are colocated with the code they cover, so they are separated by pattern
# rather than by directory. Declaring them lets SonarCloud apply test-appropriate
# rules instead of judging them as production source. Before this classification,
# roughly 178 findings came from test and story fixtures where cognitive-complexity
# and duplication rules have different value than they do in production code.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*_test.go,**/*.stories.tsx
