# Finalizer diagnostics fixture for a disposable test cluster.
#
# Apply:
#   kubectl apply -f test/manifests/finalizer-diagnostics.yaml
#
# Exercise Attention findings:
#   kubectl delete pod attention-finalizer-demo \
#     --namespace luxury-yacht-finalizer-demo --wait=false
#   kubectl delete configmap unknown-finalizer-demo \
#     --namespace luxury-yacht-finalizer-demo --wait=false
#   kubectl delete persistentvolumeclaim pvc-protection-demo \
#     --namespace luxury-yacht-finalizer-demo --wait=false
#
# The Pod and ConfigMap remain terminating because their example.com finalizers
# have no controller. Both appear in Attention under "Deletion blocked by
# Finalizer", demonstrating that the category is not workload-only. The PVC
# remains terminating while pvc-consumer-demo references it and appears in the
# same category while its protection finalizer remains.
#
# Exercise the cluster-scoped Namespace case after inspecting the objects:
#   kubectl delete namespace luxury-yacht-finalizer-demo --wait=false
#
# The Namespace remains terminating while namespaced content with finalizers is
# present.
#
# Cleanup the deliberately stuck fixture:
#   kubectl patch configmap unknown-finalizer-demo \
#     --namespace luxury-yacht-finalizer-demo --type=merge \
#     --patch '{"metadata":{"finalizers":[]}}'
#   kubectl patch pod attention-finalizer-demo \
#     --namespace luxury-yacht-finalizer-demo --type=merge \
#     --patch '{"metadata":{"finalizers":[]}}'
#
# The deleting Namespace also appears in the category while its spec.finalizers
# remain. Namespace deletion removes the Pod, which allows Kubernetes to clear
# PVC protection. If the PVC is still present, remove the Pod explicitly and wait:
#   kubectl delete pod pvc-consumer-demo \
#     --namespace luxury-yacht-finalizer-demo --wait=false --ignore-not-found
#
apiVersion: v1
kind: Namespace
metadata:
  name: luxury-yacht-finalizer-demo
  labels:
    app.kubernetes.io/name: finalizer-diagnostics
    app.kubernetes.io/part-of: luxury-yacht
spec:
  finalizers:
    - kubernetes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: unknown-finalizer-demo
  namespace: luxury-yacht-finalizer-demo
  labels:
    app.kubernetes.io/name: finalizer-diagnostics
    app.kubernetes.io/part-of: luxury-yacht
  finalizers:
    - example.com/luxury-yacht-finalizer-demo
data:
  purpose: Exercise catalog-wide finalizer findings in Luxury Yacht Attention.
---
apiVersion: v1
kind: Pod
metadata:
  name: attention-finalizer-demo
  namespace: luxury-yacht-finalizer-demo
  labels:
    app.kubernetes.io/name: finalizer-diagnostics
    app.kubernetes.io/part-of: luxury-yacht
  finalizers:
    - example.com/luxury-yacht-finalizer-demo
spec:
  automountServiceAccountToken: false
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          ephemeral-storage: 1Mi
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 32Mi
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-protection-demo
  namespace: luxury-yacht-finalizer-demo
  labels:
    app.kubernetes.io/name: finalizer-diagnostics
    app.kubernetes.io/part-of: luxury-yacht
  finalizers:
    - kubernetes.io/pvc-protection
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
  # Avoid provisioning real storage; the Pod only needs to reference this claim.
  storageClassName: ""
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-consumer-demo
  namespace: luxury-yacht-finalizer-demo
  labels:
    app.kubernetes.io/name: finalizer-diagnostics
    app.kubernetes.io/part-of: luxury-yacht
spec:
  automountServiceAccountToken: false
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.9
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 10m
          ephemeral-storage: 1Mi
          memory: 32Mi
        limits:
          cpu: 100m
          ephemeral-storage: 10Mi
          memory: 32Mi
      volumeMounts:
        - name: protected-claim
          mountPath: /data
  restartPolicy: Never
  terminationGracePeriodSeconds: 0
  volumes:
    - name: protected-claim
      persistentVolumeClaim:
        claimName: pvc-protection-demo
