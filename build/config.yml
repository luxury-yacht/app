# This file contains the configuration for this project.
# When you update `info` or `fileAssociations`, run
# `wails3 task common:update:build-assets` to refresh Wails-owned templates.
# Platform manifests retain placeholders; build tasks render values from here.
version: "3"

# This information is used to generate the build assets.
info:
  companyName: "Luxury Yacht"
  productName: "Luxury Yacht"
  productIdentifier: "app.luxury-yacht.desktop"
  description: "Luxury Yacht is a desktop app for managing Kubernetes clusters. Sail the seas of Kubernetes in style!"
  copyright: "Copyright © 2025-2026 Luxury Yacht"
  comments: "Luxury Yacht desktop application"
  version: "v2.2.1"
  cfBundleIconName: "appicon"

# Repository-owned release metadata that is not part of Wails' platform metadata.
luxuryYacht:
  betaExpiryDays: 30
  maintainer: "Luxury Yacht <info@luxury-yacht.app>"
  updaterTargets:
    - darwin/arm64
    - darwin/amd64
    - windows/amd64
    - windows/arm64
    - linux/amd64
    - linux/arm64

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js" # Watch for changes to JS/TS files included using the //wails:include directive.
      - "*.ts" # The frontend directory will be excluded entirely by the setting above.
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend:serve
      type: background
    - cmd: wails3 task run
      type: primary

# File Associations
# More information at: https://v3.wails.io/noit/done/yet
fileAssociations:
